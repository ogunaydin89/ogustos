---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - sudo
    - video
    - render
    - audio
    - input
    - lp
    - adm
    - bluetooth
    - netdev
    - plugdev
    - lpadmin
autologinGroup:  autologin
doAutoLogin:     false
displayAutologin: true
sudoersGroup:    sudo
setRootPassword: false
doReusePassword: false
userShell:       /bin/zsh

user:
    shell: /bin/zsh
    forbidden_names: [ root, nobody ]

passwordRequirements:
    nonempty: true
    minLength: 1
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "ogustos"
