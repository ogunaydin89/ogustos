---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true
    - device: /dev/pts
      mountPoint: /dev/pts
      options: [ bind ]

btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home

mountOptions:
    - filesystem: default
      options: [ defaults, noatime ]
    - filesystem: efi
      options: [ umask=0077 ]
    - filesystem: ext4
      options: [ defaults, noatime, commit=60 ]
      ssdOptions: [ discard ]
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd:3 ]
      ssdOptions: [ discard=async ]
    - filesystem: f2fs
      options: [ defaults, noatime ]
      ssdOptions: [ discard ]
    - filesystem: xfs
      options: [ defaults, noatime ]
      ssdOptions: [ discard ]
